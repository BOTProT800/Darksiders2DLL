; Darksiders2DLL 0.11.0 - restart the game after changes.
; You do not need to edit this file: without it the defaults below apply.
; ASCII only. Unknown or duplicate settings disable the loader.
; Lines starting with ; are comments: remove the ; to use a setting.
; A missing setting takes its default value.
[loader]
; true = load mods; false = keep only the DirectInput proxy.
enabled=true
; override = replace verified assets; observe = only log what would be replaced.
mode=override
; DDS or PNG textures with another size, format or mip count than the original:
;   resize = delivered at their own size (default); if the game does not take
;            it, the texture is converted as with native.
;   native = converted to the original's size and format.
;   exact  = only DDS identical in size and format to the original.
;textures=native
; Models (.2): override_unchecked (default: any mesh, also larger than the
; original), override_shape, override_positions, observe or off.
; Experimental: if a model mod breaks the game, use models=off.
;models=off
; Animations (.anm): off (default) or observe (log only, never replaced).
;animations=off
